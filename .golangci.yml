version: "2"
run:
  timeout: 10m
  build-tags: [integration, e2e]
linters:
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    depguard:
      rules:
        cloud-neutral-core:
          # The core, sources, destinations and query layers reach cloud services only
          # through standard interfaces (S3 API, Iceberg REST). No provider SDKs.
          files:
            - "**/internal/core/**"
            - "**/internal/source/**"
            - "**/internal/dest/**"
            - "**/internal/query/**"
          deny:
            - pkg: "github.com/aws/"
              desc: "no AWS SDK in the cloud-neutral core (storage is reached through iceberg-go's S3 API layer)"
            - pkg: "cloud.google.com/"
              desc: "no GCP SDK in the cloud-neutral core"
            - pkg: "github.com/Azure/"
              desc: "no Azure SDK in the cloud-neutral core"
            - pkg: "github.com/oracle/"
              desc: "no OCI SDK in the cloud-neutral core"
            - pkg: "github.com/cloudflare/"
              desc: "no Cloudflare SDK in the cloud-neutral core"
            - pkg: "gocloud.dev/"
              desc: "cloud abstractions only via iceberg-go"
    errcheck:
      # Deferred cleanups whose errors cannot be acted on.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Conn).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*go.mongodb.org/mongo-driver/v2/mongo.Client).Disconnect
        - (*go.mongodb.org/mongo-driver/v2/mongo.Cursor).Close
        - (*go.mongodb.org/mongo-driver/v2/mongo.ChangeStream).Close
        - (lakesync/internal/source.EventIterator).Close
        - (lakesync/internal/source.Source).Close
        - (lakesync/internal/dest.Destination).Close
        - (*lakesync/internal/query.Engine).Close
        - (*lakesync/internal/dest/iceberg.Destination).Close
        - (*lakesync/internal/source/mongodb.Source).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Sscan
  exclusions:
    paths:
      - hack/
formatters:
  enable:
    - gofmt
